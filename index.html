<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tài liệu Velclaw" />
    <title>Velclaw Docs</title>
    <style>
      :root{--bg:#0a0d13;--panel:#111622;--panel-2:#171d2b;--text:#edf3fb;--muted:#9da9bd;--line:#293247;--cyan:#65e4da;--violet:#a898ff;--available:#65e4a2;--preview:#f2c879;--planned:#9da9bd}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% 0,#1a385766,transparent 28rem),var(--bg);color:var(--text);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,select{font:inherit}.topbar{height:64px;position:sticky;top:0;z-index:4;background:#0a0d13eF;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1440px)/2));gap:24px}.brand{font-weight:800;letter-spacing:-.04em;display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--cyan);border-radius:8px;color:var(--cyan)}.product{color:var(--muted);font-size:.85rem;border-left:1px solid var(--line);padding-left:18px}.spacer{flex:1}.language{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:250px minmax(0,760px) 210px;gap:42px;padding:34px 28px 80px}.sidebar{position:sticky;top:94px;align-self:start}.sidebar-label,.toc-title{color:var(--muted);text-transform:uppercase;font-size:.7rem;font-weight:800;letter-spacing:.11em;margin:0 0 10px}.nav-group{margin:0 0 22px}.nav-group h2{font-size:.76rem;margin:0 0 5px;color:#d6ddec}.nav-link{display:flex;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:.89rem}.nav-link:hover{color:var(--text);background:var(--panel-2)}.nav-link.active{background:#203744;color:var(--cyan);font-weight:700}.article{min-width:0}.breadcrumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.83rem;margin:4px 0 28px}.crumb-separator{color:#5e687b}.article-header{border-bottom:1px solid var(--line);padding-bottom:27px;margin-bottom:34px}.status{display:inline-flex;border:1px solid;border-radius:999px;padding:2px 9px;text-transform:uppercase;font-weight:800;font-size:.68rem;letter-spacing:.08em}.status.available{color:var(--available);border-color:#3c8268;background:#173629}.status.preview{color:var(--preview);border-color:#82682f;background:#392e16}.status.planned{color:var(--planned);border-color:#566073;background:#1e2532}.article h1{font-size:clamp(2.2rem,6vw,3.7rem);letter-spacing:-.06em;line-height:1.08;margin:14px 0}.summary{color:var(--muted);font-size:1.08rem;margin:0;max-width:690px}.doc-section{margin:0 0 46px;scroll-margin-top:88px}.doc-section h2{font-size:1.55rem;letter-spacing:-.035em;line-height:1.2;margin:0 0 12px}.doc-section h3{font-size:1.1rem;margin:23px 0 7px}.doc-section p{margin:0 0 14px;color:#d2d9e5}.doc-section ul,.doc-section ol{padding-left:22px;color:#d2d9e5}.code-wrap{margin:18px 0;background:#0d111a;border:1px solid var(--line);border-radius:10px;overflow:hidden}.code-bar{display:flex;justify-content:space-between;padding:8px 12px;color:var(--muted);font-size:.75rem;border-bottom:1px solid var(--line)}.copy{background:transparent;border:0;color:var(--cyan);cursor:pointer}.code-wrap pre{padding:15px;margin:0;overflow:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d9e7ff}.related{border-top:1px solid var(--line);padding-top:28px}.related h2{font-size:1.1rem}.related-list{display:flex;flex-wrap:wrap;gap:8px}.related-link{border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:7px;color:var(--cyan);font-size:.85rem}.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}.page-link{border:1px solid var(--line);background:var(--panel);padding:13px;border-radius:9px}.page-link.next{text-align:right}.page-link small{display:block;color:var(--muted)}.page-link strong{color:var(--cyan);font-size:.9rem}.toc{position:sticky;top:94px;align-self:start;border-left:1px solid var(--line);padding-left:17px}.toc a{display:block;color:var(--muted);font-size:.82rem;padding:4px 0}.toc a:hover{color:var(--cyan)}.empty{padding:30px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:220px minmax(0,1fr);gap:28px}.toc{display:none}}@media(max-width:680px){.topbar{padding:0 16px;gap:12px}.product{display:none}.layout{display:block;padding:22px 18px 60px}.sidebar{position:static;margin-bottom:28px;border-bottom:1px solid var(--line)}.sidebar-label{display:none}.nav-groups{display:flex;gap:16px;overflow:auto}.nav-group{min-width:156px}.breadcrumb{margin-bottom:20px}.pager{grid-template-columns:1fr}.page-link.next{text-align:left}}
    </style>
  </head>
  <body>
    <header class="topbar"><a class="brand" href="#/getting-started"><span class="mark">V</span><span>velclaw</span></a><span class="product">Documentation</span><span class="spacer"></span><label><span class="sr-only">Language</span><select class="language" id="language" aria-label="Language"><option value="vi">VI</option><option value="en">EN</option></select></label></header>
    <main class="layout"><aside class="sidebar" aria-label="Documentation navigation"><p class="sidebar-label" id="nav-label">Tài liệu</p><nav class="nav-groups" id="sidebar"></nav></aside><article class="article" id="article" aria-live="polite"></article><aside class="toc" id="toc" aria-label="Table of contents"></aside></main>
    <script>
      const catalog=[
        {id:'getting-started',group:'Bắt đầu',groupEn:'Getting started',title:'Bắt đầu',titleEn:'Getting started'}, {id:'workspace',group:'Nền tảng',groupEn:'Platform',title:'Workspace',titleEn:'Workspace'}, {id:'agents',group:'Nền tảng',groupEn:'Platform',title:'Tác tử',titleEn:'Agents'}, {id:'build-runtime',group:'Nền tảng',groupEn:'Platform',title:'Build & runtime',titleEn:'Build & runtime'}, {id:'github-delivery',group:'Phân phối',groupEn:'Delivery',title:'GitHub & phát hành',titleEn:'GitHub & delivery'}, {id:'security',group:'Quản trị',groupEn:'Governance',title:'Bảo mật',titleEn:'Security'}
      ];
      const labels={vi:{docs:'Tài liệu',contents:'Trong bài này',previous:'Trước',next:'Tiếp',notFound:'Không tìm thấy bài viết.'},en:{docs:'Documentation',contents:'On this page',previous:'Previous',next:'Next',notFound:'Article not found.'}};
      let language='vi'; let currentId='getting-started';
      const esc=(value='')=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function route(){const query=new URLSearchParams(location.search);const hash=location.hash.replace(/^#\/?/,'');return {id:query.get('doc')||hash||'getting-started',lang:query.get('lang')||localStorage.getItem('velclaw-language')||'vi'};}
      function articleUrl(id){return `#/`+id;}
      function renderSidebar(){const groups={};catalog.forEach(item=>{const name=language==='en'?item.groupEn:item.group;(groups[name]??=[]).push(item)});document.getElementById('nav-label').textContent=labels[language].docs;document.getElementById('sidebar').innerHTML=Object.entries(groups).map(([name,items])=>`<div class="nav-group"><h2>${esc(name)}</h2>${items.map(item=>`<a class="nav-link ${item.id===currentId?'active':''}" href="${articleUrl(item.id)}">${esc(language==='en'?item.titleEn:item.title)}</a>`).join('')}</div>`).join('');}
      function renderToc(sections){document.getElementById('toc').innerHTML=`<p class="toc-title">${labels[language].contents}</p>${sections.map(s=>`<a href="#${s.slug}">${esc(s.heading)}</a>`).join('')}`;}
      function codeBlock(example,index){return `<div class="code-wrap"><div class="code-bar"><span>${esc(example.language||'text')}</span><button class="copy" type="button" data-code="code-${index}">Copy</button></div><pre id="code-${index}"><code>${esc(example.code)}</code></pre></div>`;}
      function renderArticle(doc){const position=catalog.findIndex(item=>item.id===currentId);const prev=catalog[position-1],next=catalog[position+1];document.title=`${doc.title} — Velclaw Docs`;document.querySelector('meta[name="description"]').content=doc.summary;document.documentElement.lang=language;document.getElementById('article').innerHTML=`<nav class="breadcrumb" aria-label="Breadcrumb"><a href="#/getting-started">Velclaw</a><span class="crumb-separator">/</span><span>${esc(doc.category)}</span><span class="crumb-separator">/</span><strong>${esc(doc.title)}</strong></nav><header class="article-header"><span class="status ${esc(doc.status)}">${esc(doc.status)}</span><h1>${esc(doc.title)}</h1><p class="summary">${esc(doc.summary)}</p></header>${doc.sections.map((section,i)=>`<section class="doc-section" id="${section.slug}"><h2>${esc(section.heading)}</h2>${section.body.map(p=>`<p>${esc(p)}</p>`).join('')}${section.bullets?`<ul>${section.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${section.examples?.map((x,n)=>codeBlock(x,`${i}-${n}`)).join('')||''}</section>`).join('')}<section class="related"><h2>Related</h2><div class="related-list">${doc.relatedLinks.map(x=>`<a class="related-link" href="${articleUrl(x.id)}">${esc(x.label)} →</a>`).join('')}</div></section><nav class="pager" aria-label="Article navigation">${prev?`<a class="page-link" href="${articleUrl(prev.id)}"><small>← ${labels[language].previous}</small><strong>${esc(prev.title||prev.id)}</strong></a>`:'<span></span>'}${next?`<a class="page-link next" href="${articleUrl(next.id)}"><small>${labels[language].next} →</small><strong>${esc(next.title||next.id)}</strong></a>`:'<span></span>'}</nav>`;renderToc(doc.sections);document.querySelectorAll('[data-code]').forEach(button=>button.addEventListener('click',async()=>{const text=document.getElementById(button.dataset.code).innerText;try{await navigator.clipboard.writeText(text);button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1200)}catch{button.textContent='Select text'}}));}
      async function load(){const next=route();language=['vi','en'].includes(next.lang)?next.lang:'vi';currentId=catalog.some(x=>x.id===next.id)?next.id:'getting-started';document.getElementById('language').value=language;try{const response=await fetch(`docs/${language}/${currentId}.json`);if(!response.ok)throw new Error('not found');const doc=await response.json();renderSidebar();renderArticle(doc)}catch(error){document.getElementById('article').innerHTML=`<p class="empty">${labels[language].notFound}</p>`;console.warn(error)}}
      document.getElementById('language').addEventListener('change',event=>{language=event.target.value;localStorage.setItem('velclaw-language',language);const url=new URL(location);url.searchParams.set('lang',language);location.href=url});window.addEventListener('hashchange',load);window.addEventListener('popstate',load);load();
    </script>
  </body>
</html>
