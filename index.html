<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELCLAW - Documentation Center</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0B0F19; }
    </style>
</head>
<body class="text-gray-200 font-sans antialiased">

    <!-- THANH ĐIỀU HƯỚNG (Chỉ giữ lại VELCLAW) -->
    <nav class="sticky top-0 z-50 bg-[#0B0F19]/90 border-b border-gray-800 px-4 py-4 flex items-center justify-between">
        <span class="text-lg font-bold tracking-wider text-white">
            VELCLAW
        </span>
        <span id="app-version" class="text-xs bg-gray-800 border border-gray-700 px-2 py-1 rounded text-gray-300">Loading...</span>
    </nav>

    <!-- NỘI DUNG CHÍNH -->
    <div class="px-4 pt-16 pb-12 text-center">
        <span class="inline-block px-3 py-1 text-[10px] font-medium text-sky-400 bg-sky-400/10 rounded-full border border-sky-400/20 mb-4">
            ✨ Nền tảng tài liệu chính thức
        </span>
        <h1 class="text-3xl font-extrabold text-white tracking-tight leading-tight">
            Hệ sinh thái mã nguồn <br/>
            <span class="bg-gradient-to-r from-sky-400 to-purple-400 bg-clip-text text-transparent">Đơn giản & Công khai</span>
        </h1>
        <p class="mt-4 text-sm text-gray-400 max-w-sm mx-auto">
            Tra cứu tài liệu hướng dẫn và các gói thư viện NPM phân phối miễn phí rộng rãi bởi doanh nghiệp.
        </p>
    </div>

    <!-- DANH SÁCH GÓI DỮ LIỆU -->
    <div class="px-4 max-w-xl mx-auto space-y-4 pb-16">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-2">Các gói npm hiện hành:</h2>
        <div id="package-list" class="space-y-4">
            <p class="text-xs text-gray-500 text-center py-4">Đang tải dữ liệu từ hệ thống...</p>
        </div>
    </div>

    <!-- CHÂN TRANG -->
    <footer class="border-t border-gray-900 bg-[#090D14] py-8 text-center text-[10px] text-gray-500">
        <p>© <span id="footer-year">2026</span> <span id="footer-company">VELCLAW</span>. All rights reserved.</p>
    </footer>

    <script>
        async function loadProjectData() {
            try {
                const response = await fetch('./data.json');
                const data = await response.json();

                document.getElementById('app-version').innerText = data.version;
                document.getElementById('footer-company').innerText = data.company;
                document.getElementById('footer-year').innerText = data.last_updated;

                const listContainer = document.getElementById('package-list');
                listContainer.innerHTML = '';

                data.packages.forEach(pkg => {
                    const cardHTML = `
                        <div class="bg-[#161B26] border border-gray-800 p-5 rounded-xl hover:border-gray-700 transition-all">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-lg">${pkg.icon}</span>
                                <h3 class="text-sm font-bold text-white">${pkg.name}</h3>
                            </div>
                            <p class="text-xs text-gray-400 mb-3 leading-relaxed">${pkg.description}</p>
                            <div class="bg-[#0B0F19] border border-gray-800 px-3 py-2 rounded font-mono text-[11px] text-emerald-400 flex justify-between items-center">
                                <span>${pkg.install_cmd}</span>
                                <span class="text-gray-600 text-[9px] uppercase font-sans">Copy</span>
                            </div>
                        </div>
                    `;
                    listContainer.innerHTML += cardHTML;
                });

            } catch (error) {
                console.error("Lỗi dữ liệu:", error);
            }
        }
        window.onload = loadProjectData;
    </script>
</body>
</html>
