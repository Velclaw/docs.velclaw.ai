<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Velclaw documentation">
  <title>Velclaw Docs</title>
  <link rel="stylesheet" href="docs.css">
</head>
<body class="docs-page">
  <header class="topbar"><a class="wordmark" href="index.html"><span class="logo-mark">V</span><span>velclaw</span></a><div class="top-actions"><a href="index.html" data-i18n="home">Home</a><a id="github" href="https://github.com/Velclaw/Velclaw" target="_blank" rel="noreferrer">GitHub ↗</a><select id="language" aria-label="Language"><option value="vi">VI</option><option value="en">EN</option></select></div></header>
  <div class="docs-layout">
    <aside class="sidebar"><div class="sidebar-title" data-i18n="docs">Documentation</div><nav id="sidebar-nav"></nav></aside>
    <main class="doc-main"><div class="breadcrumbs"><a href="index.html">Velclaw</a><span>/</span><span id="crumb"></span></div><article id="content"><p class="loading">Loading documentation…</p></article></main>
    <aside class="toc" id="toc"><div class="toc-title" data-i18n="onThisPage">On this page</div><nav id="toc-list"></nav></aside>
  </div>
  <footer class="doc-footer"><span>Velclaw</span><span data-i18n="sourceVerified">Source-traceable documentation · source verified</span></footer>
<script>
const slugs=['getting-started','workspace','agents','build-runtime','github-delivery','security'];
const labels={en:{'getting-started':'Getting started',workspace:'Workspace',agents:'Agents & integrations','build-runtime':'Build & runtime','github-delivery':'GitHub delivery',security:'Security'},vi:{'getting-started':'Bắt đầu',workspace:'Workspace',agents:'Agents & tích hợp','build-runtime':'Build & runtime','github-delivery':'GitHub delivery',security:'Bảo mật'}};
const ui={en:{home:'Home',docs:'Documentation',onThisPage:'On this page',sourceVerified:'Source-traceable documentation · source verified',copy:'Copy',copied:'Copied',available:'Available',preview:'Preview',planned:'Planned / unverified'},vi:{home:'Trang chủ',docs:'Tài liệu',onThisPage:'Trong trang này',sourceVerified:'Tài liệu có truy vết source · đã xác minh',copy:'Sao chép',copied:'Đã sao chép',available:'Đã có',preview:'Preview',planned:'Planned / chưa xác minh'}};
let data=null,lang='vi';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=()=>new URLSearchParams(location.search).get('doc')||'getting-started';
async function load(){const r=await fetch('./data.json');data=await r.json();const q=new URLSearchParams(location.search).get('lang');lang=data.translations[q]?q:(localStorage.getItem('velclaw-language')||'vi');document.getElementById('language').value=lang;renderNav();await renderDoc();}
function renderNav(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(n=>{const k=n.dataset.i18n;if(ui[lang][k])n.textContent=ui[lang][k]});document.getElementById('github').href=data.product.repository;document.getElementById('sidebar-nav').innerHTML=slugs.map(s=>`<a class="side-link ${s===slug()?'active':''}" href="doc.html?doc=${s}&lang=${lang}">${esc(labels[lang][s])}</a>`).join('')}
async function renderDoc(){const s=slug();if(!slugs.includes(s)){location.replace('doc.html?doc=getting-started&lang='+lang);return}const r=await fetch(`./docs/${lang}/${s}.json`);if(!r.ok)throw Error('Document not found');const d=await r.json();document.title=`${d.title} — Velclaw Docs`;document.getElementById('crumb').textContent=d.title;const body=(d.sections||[]).map((sec,i)=>{const id=sec.slug||`section-${i+1}`;const paragraphs=(sec.body||[]).map(x=>`<p>${esc(x)}</p>`).join('');const examples=(sec.examples||[]).map((x,j)=>`<div class="code"><div class="code-head"><span>${esc(x.language||'text')}</span><button class="copy" type="button" data-code="${encodeURIComponent(x.code)}">${ui[lang].copy}</button></div><pre><code>${esc(x.code)}</code></pre></div>`).join('');return `<section class="doc-section" id="${esc(id)}"><h2>${esc(sec.heading)}</h2>${paragraphs}${examples}</section>`}).join('');document.getElementById('content').innerHTML=`<div class="doc-eyebrow">${esc(d.category||'Documentation')} · <span class="status ${d.status||'available'}">${ui[lang][d.status]||d.status||ui[lang].available}</span></div><h1>${esc(d.title)}</h1><p class="summary">${esc(d.summary||'')}</p>${body}`;document.getElementById('toc-list').innerHTML=(d.sections||[]).map((x,i)=>`<a href="#${esc(x.slug||`section-${i+1}`)}">${esc(x.heading)}</a>`).join('');document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',async()=>{await navigator.clipboard.writeText(decodeURIComponent(b.dataset.code));const old=b.textContent;b.textContent=ui[lang].copied;setTimeout(()=>b.textContent=old,1200)}))}
document.getElementById('language').addEventListener('change',e=>{localStorage.setItem('velclaw-language',e.target.value);location.href=`doc.html?doc=${slug()}&lang=${e.target.value}`});load().catch(e=>{document.getElementById('content').innerHTML=`<div class="notice"><strong>Unable to load this document.</strong><p>${esc(e.message)}</p></div>`});
</script></body></html>
