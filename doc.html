<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Velclaw documentation"><title>Velclaw Docs</title><link rel="stylesheet" href="docs.css"></head><body class="docs-page"><header class="topbar"><a class="wordmark" href="index.html"><span class="logo-mark">V</span><span>velclaw</span></a><div class="top-actions"><label class="search" aria-label="Search documentation"><span>⌕</span><input id="doc-search" type="search" placeholder="Search docs" autocomplete="off"><kbd>/</kbd></label><a href="index.html">Home</a><a id="github" href="https://github.com/Velclaw/Velclaw" target="_blank" rel="noreferrer">GitHub ↗</a><button class="theme-toggle" id="theme-toggle" type="button">☼</button><select id="language" aria-label="Language"><option value="vi">VI</option><option value="en">EN</option></select></div></header><div class="docs-layout"><aside class="sidebar"><div class="sidebar-title">Documentation</div><nav id="sidebar-nav"></nav></aside><main class="doc-main"><div class="breadcrumbs"><a href="index.html">Velclaw</a><span>/</span><span id="crumb"></span></div><article id="content"><p class="loading">Loading documentation…</p></article></main><aside class="toc"><div class="toc-title">On this page</div><nav id="toc-list"></nav></aside></div><footer class="doc-footer"><span>Velclaw</span><span>Source-traceable documentation · source verified</span></footer><script src="ui-polish.js"></script><script>const slugs=window.VELCLAW_DOCS;const labels=window.VELCLAW_LABELS;const ui={en:{copy:'Copy',copied:'Copied',available:'Available',preview:'Preview'},vi:{copy:'Sao chép',copied:'Đã sao chép',available:'Đã có',preview:'Preview'}};let lang='vi';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const data=await(await fetch('./data.json')).json();const q=new URLSearchParams(location.search).get('lang');lang=data.translations[q]?q:(localStorage.getItem('velclaw-language')||'vi');document.documentElement.lang=lang;document.getElementById('language').value=lang;document.getElementById('github').href=data.product.repository;const s=new URLSearchParams(location.search).get('doc')||'getting-started';document.getElementById('sidebar-nav').innerHTML=slugs.map(x=>`<a class="side-link ${x===s?'active':''}" href="doc.html?doc=${x}&lang=${lang}">${labels[lang][x]}</a>`).join('');const r=await fetch(`./docs/${lang}/${s}.json`);if(!r.ok)throw Error('Document not found');const d=await r.json();document.title=`${d.title} — Velclaw Docs`;document.getElementById('crumb').textContent=d.title;document.getElementById('content').innerHTML=`<div class="doc-eyebrow">${esc(d.category||'Documentation')} · <span class="status ${d.status||'available'}">${ui[lang][d.status]||d.status||ui[lang].available}</span></div><h1>${esc(d.title)}</h1><p class="summary">${esc(d.summary||'')}</p>`+(d.sections||[]).map((sec,i)=>`<section class="doc-section" id="${esc(sec.slug||'section-'+(i+1))}"><h2>${esc(sec.heading)}</h2>`+(sec.body||[]).map(x=>`<p>${esc(x)}</p>`).join('')+(sec.examples||[]).map(x=>`<div class="code"><div class="code-head"><span>${esc(x.language||'text')}</span><button class="copy" data-code="${encodeURIComponent(x.code)}" data-copied="${ui[lang].copied}">${ui[lang].copy}</button></div><pre><code>${esc(x.code)}</code></pre></div>`).join('')+'</section>').join('');document.getElementById('toc-list').innerHTML=(d.sections||[]).map((x,i)=>`<a href="#${esc(x.slug||'section-'+(i+1))}">${esc(x.heading)}</a>`).join('');bindCopyButtons();bindSearch()}document.getElementById('language').onchange=e=>{localStorage.setItem('velclaw-language',e.target.value);const s=new URLSearchParams(location.search).get('doc')||'getting-started';location.href=`doc.html?doc=${s}&lang=${e.target.value}`};load().catch(e=>document.getElementById('content').innerHTML=`<div class="notice"><strong>Unable to load document.</strong><p>${esc(e.message)}</p></div>`);</script></body></html>
