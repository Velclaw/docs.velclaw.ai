<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Velclaw documentation">
<title>Velclaw Docs</title>
<link rel="stylesheet" href="docs.css">
<style>
.doc-brand-image{display:block;width:min(220px,70%);height:auto;margin:0 0 22px}
.doc-media{margin:24px 0 34px;border:1px solid var(--line-strong);background:var(--surface);overflow:hidden}
.doc-media img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#050509}
.doc-media figcaption{padding:9px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:.64rem}
.doc-bullets{margin:10px 0 18px;padding-left:22px;color:var(--muted)}
.doc-bullets li{padding:3px 0}
.related{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.related a{border:1px solid var(--line-strong);padding:7px 10px;color:var(--muted);font-size:.68rem}
.related a:hover{border-color:var(--purple);color:var(--purple-2);background:var(--purple-soft)}
</style>
</head>
<body class="docs-page">
<header class="topbar">
<button class="menu-toggle" id="menu-toggle" type="button" aria-label="Mở menu" aria-expanded="false"><span></span><span></span><span></span></button>
<a class="wordmark" href="index.html"><img class="logo-mark" src="assets/velclaw-wordmark.svg" alt="Velclaw" style="width:118px;height:auto;border:0;background:none;box-shadow:none"></a>
<div class="top-actions">
<label class="search" aria-label="Search documentation"><span>⌕</span><input id="doc-search" type="search" placeholder="Tìm kiếm..." autocomplete="off"><kbd>⌘K</kbd></label>
<a href="index.html">Docs</a><a id="github" href="https://github.com/Velclaw/Velclaw" target="_blank" rel="noreferrer">GitHub ↗</a>
<button class="theme-toggle" id="theme-toggle" type="button">☼</button>
<select id="language" aria-label="Language"><option value="vi">VI</option><option value="en">EN</option></select>
</div>
</header>
<div class="docs-layout">
<aside class="sidebar">
<div class="drawer-head"><strong>Xem tài liệu</strong><button class="drawer-close" id="drawer-close" type="button" aria-label="Đóng menu">×</button></div>
<div class="sidebar-title">Phần</div><nav id="sidebar-nav"></nav>
<div class="sidebar-toc"><div class="sidebar-toc-title">Trong phần này</div><nav id="mobile-toc-list"></nav></div>
</aside>
<main class="doc-main">
<div class="breadcrumbs"><a href="index.html">Bắt đầu</a><span>/</span><strong id="crumb">Velclaw</strong></div>
<div class="reader-actions"><button class="copy-page" id="copy-page" type="button">▣ &nbsp; Sao chép trang</button></div>
<article id="content"><p class="loading">Đang tải tài liệu…</p></article>
</main>
<aside class="toc"><div class="toc-title">Trong phần này</div><nav id="toc-list"></nav></aside>
</div>
<footer class="doc-footer"><span>VELCLAW</span><span>Source-traceable documentation · verified</span></footer>
<script src="ui-polish.js"></script>
<script>
const slugs=window.VELCLAW_DOCS;
const labels=window.VELCLAW_LABELS;
const MEDIA={
  'getting-started':{src:'https://raw.githubusercontent.com/Velclaw/Velclaw/main/assets/velclaw-intro.gif',alt:'Velclaw introduction',caption:{vi:'Giới thiệu Velclaw',en:'Velclaw introduction'}},
  'build-runtime':{src:'https://raw.githubusercontent.com/Velclaw/Velclaw/main/assets/velclaw-terminal.gif',alt:'Velclaw terminal workflow',caption:{vi:'Workflow terminal và runtime',en:'Terminal and runtime workflow'}},
  'github-delivery':{src:'https://raw.githubusercontent.com/Velclaw/Velclaw/main/assets/velclaw-footer.gif',alt:'Velclaw delivery ecosystem',caption:{vi:'Hệ sinh thái và điểm kết nối phát hành',en:'Delivery ecosystem and integration surface'}}
};
const ui={en:{copy:'Copy',copied:'Copied',page:'Copy page',available:'Available',preview:'Preview',related:'Related'},vi:{copy:'Sao chép',copied:'Đã sao chép',page:'Sao chép trang',available:'Đã có',preview:'Preview',related:'Liên quan'}};
let lang='vi';let docData=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mediaHtml(slug){const m=MEDIA[slug];if(!m)return '';return `<figure class="doc-media"><img loading="lazy" src="${m.src}" alt="${esc(m.alt)}"><figcaption>${esc(m.caption[lang])}</figcaption></figure>`}
async function load(){
 const data=await(await fetch('./data.json')).json();
 const q=new URLSearchParams(location.search).get('lang');
 lang=data.translations[q]?q:(localStorage.getItem('velclaw-language')||'vi');
 document.documentElement.lang=lang;document.getElementById('language').value=lang;document.getElementById('github').href=data.product.repository;
 const s=new URLSearchParams(location.search).get('doc')||'getting-started';
 document.getElementById('sidebar-nav').innerHTML=slugs.map(x=>`<a class="side-link ${x===s?'active':''}" href="doc.html?doc=${x}&lang=${lang}">${labels[lang][x]}</a>`).join('');
 const r=await fetch(`./docs/${lang}/${s}.json`);if(!r.ok)throw Error('Document not found');
 const d=await r.json();docData=d;document.title=`${d.title} — Velclaw Docs`;document.getElementById('crumb').textContent=d.title;
 const sections=(d.sections||[]).map((sec,i)=>`<section class="doc-section" id="${esc(sec.slug||'section-'+(i+1))}"><h2>${esc(sec.heading)}</h2>`+(sec.body||[]).map(x=>`<p>${esc(x)}</p>`).join('')+(sec.bullets?.length?`<ul class="doc-bullets">${sec.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'')+(sec.examples||[]).map(x=>`<div class="code"><div class="code-head"><span>${esc(x.language||'text')}</span><button class="copy" data-code="${encodeURIComponent(x.code)}" data-copied="${ui[lang].copied}">${ui[lang].copy}</button></div><pre><code>${esc(x.code)}</code></pre></div>`).join('')+'</section>').join('');
 const related=d.relatedLinks?.length?`<div class="related"><span class="doc-eyebrow">${ui[lang].related}</span>${d.relatedLinks.map(x=>`<a href="doc.html?doc=${encodeURIComponent(x.id)}&lang=${lang}">${esc(x.label)}</a>`).join('')}</div>`:'';
 document.getElementById('content').innerHTML=`<div class="doc-eyebrow">${esc(d.category||'Documentation')} · <span class="status ${d.status||'available'}">${ui[lang][d.status]||d.status||ui[lang].available}</span></div><h1>${esc(d.title)}</h1><p class="summary">${esc(d.summary||'')}</p>${mediaHtml(s)}${sections}${related}`;
 const toc=(d.sections||[]).map((x,i)=>`<a href="#${esc(x.slug||'section-'+(i+1))}">${esc(x.heading)}</a>`).join('');
 document.getElementById('toc-list').innerHTML=toc;document.getElementById('mobile-toc-list').innerHTML=toc;document.getElementById('copy-page').textContent='▣  '+ui[lang].page;
 bindCopyButtons();bindToc();bindSearch();
}
document.getElementById('language').onchange=e=>{localStorage.setItem('velclaw-language',e.target.value);const s=new URLSearchParams(location.search).get('doc')||'getting-started';location.href=`doc.html?doc=${s}&lang=${e.target.value}`};
document.getElementById('copy-page').onclick=async()=>{if(!docData)return;const text=[docData.title,docData.summary,...(docData.sections||[]).flatMap(s=>[s.heading,...(s.body||[]),...(s.bullets||[]),...(s.examples||[]).map(e=>e.code)])].join('\n\n');try{await navigator.clipboard.writeText(text)}catch{return}const b=document.getElementById('copy-page');const old=b.textContent;b.textContent='✓  '+ui[lang].copied;setTimeout(()=>b.textContent=old,1200)};
load().catch(e=>document.getElementById('content').innerHTML=`<div class="notice"><strong>Không thể tải tài liệu.</strong><p>${esc(e.message)}</p></div>`);
</script>
</body></html>
