name: Velclaw CI Recovery

on:
  push:
    branches:
      - ci/recovery-v1
  pull_request:
    branches:
      - main

concurrency:
  group: velclaw-ci-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Node 22 / Nuxt Docs Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Content tests
        run: npm run test:content

      - name: Production static build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Docker version
        run: docker version

      - name: Build documentation image
        run: docker build --pull --tag velclaw-docs:ci .

      - name: Inspect image
        run: docker image inspect velclaw-docs:ci >/dev/null
